name: Verify Polybrutus D45 exact geometry, parent lineage and Zenodo bibliography
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d45:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Verify exact primary 1225 distances, ranks and ideal graph
        run: python src/verify_d45.py
      - name: Verify separately reconstructed Fraction-based labelled metric
        run: python tests/independent_d45.py
      - name: Verify deterministic exact certificate bytes
        run: git diff --exit-code -- results/certificate_d45.json
      - name: Check full immutable frozen D44 scientific source and certificate
        run: |
          python -c "from pathlib import Path;from zipfile import ZipFile;import hashlib;p=Path('prior/d44/frozen_scientific_tag_v0.1.0.zip');c=Path('prior/d44/results/certificate_d44.json').read_bytes();assert hashlib.sha256(p.read_bytes()).hexdigest()=='e74794dbfa9c6eb4bb3307dc95d57462dc4176516260c7855f1eb31acde231ec';assert hashlib.sha256(c).hexdigest()=='8c833b8907689ccc4e5519bd6d3c57eadba14876336dcc8d0fe63b672555b9e9';z=ZipFile(p);assert len(z.namelist())==28 and z.testzip() is None and z.read('results/certificate_d44.json')==c"
      - name: Guard against copied 31D keywords and missing Zenodo references
        run: |
          python -c "import json;from pathlib import Path;c=json.loads(Path('results/certificate_d45.json').read_text());m=json.loads(Path('publication/zenodo_metadata_blueprint.json').read_text());assert c['dimension']==m['scientific_dimension']==45 and c['vertices']==m['norm_one_vertices']==50 and c['pairs']==m['exact_labelled_squared_pairs']==1225;assert c['eigenvalue_25_multiplicity']==m['model_eigenvalue_25_multiplicity']==39;assert c['parent_doi']==m['scientific_parent_doi']=='10.5281/zenodo.24415463';assert m['related_identifiers']==[{'identifier':'10.5281/zenodo.24415463','relation':'isDerivedFrom','resource_type':'publication-preprint','scheme':'doi'}];assert 'affine Euclidean dimension forty-five' in m['keywords'] and 'thirty-ninefold ideal eigenvalue' in m['keywords'];assert 'thirty-one' not in str(m['keywords']) and 'twenty-fivefold' not in str(m['keywords']);assert len(m['references'])==2 and all('10.5281/zenodo.' in t for t in m['references']) and any('10.5281/zenodo.24415463' in t for t in m['references']) and any('10.5281/zenodo.24407952' in t for t in m['references']);assert all(x in Path('publication/POLYBRUTUS_45D_NOTE.md').read_text() for x in ('## References','10.5281/zenodo.24415463','10.5281/zenodo.24407952'));print('ZENODO_METADATA_QA_GATE_PASS')"
